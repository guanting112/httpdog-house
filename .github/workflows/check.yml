name: check

# Every push and pull request: the type checks, the unit tests and the fuzz properties
# (make check), then a build of the UI and a bundle of both Workers (make dry-run).
#
# Nothing here reaches Cloudflare. This repository's Actions hold no credentials; deploying is
# done from a machine, with `make setup` and `make deploy`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Actions are always pinned to a commit SHA: a tag can be moved, a SHA cannot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version this project is developed with
          bun-version: 1.4.4
      # Exactly what bun.lock lists; a lock file that does not match package.json fails here
      - run: make install
      - run: make check
      # Builds the UI and bundles both Workers from the committed configs, without uploading
      - run: make dry-run
