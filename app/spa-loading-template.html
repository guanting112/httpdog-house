<!-- Shown while the app's code loads, in the colours of the theme the page is about to use, so it
     never flashes the other one. data-theme is already set by the script in nuxt.config.ts. -->
<style>
  html, body { margin: 0; background: #06080c; }
  html[data-theme='light'], html[data-theme='light'] body { background: #f6f4ee; }
  .hd-boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 16px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: #7f8a9b;
  }
  html[data-theme='light'] .hd-boot { color: #666c75; }
  .hd-boot i { display: inline-block; width: 0.55em; height: 1em; margin-left: 0.2em; vertical-align: -0.14em; background: #ffb454; animation: hd-blink 1.1s steps(1) infinite; }
  html[data-theme='light'] .hd-boot i { background: #955600; }
  @keyframes hd-blink { 50% { opacity: 0; } }
</style>
<div class="hd-boot"><span>httpdog<i></i></span></div>
